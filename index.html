<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title> Random Joke Viwer</title>
        <style>
                body {
                        font-family: Arial, sans-serif;
                        background: #fafafa;
                        display: flex;
                        flex-direction: column;
                        align-items: center;
                        padding: 40px;
                }
                head {
                        color: #333;
                        margin-bottom: 20px;
                }
                #jokeBox {
                        font-size: 22px;
                        background: #fff;
                        border: 2px solid #eee;
                        border-radius: 10px;
                        padding: 20px;
                        width: 60%;
                        min-height: 100px;
                        text-align: center;
                        box-shadow: 0 3px 6px rgba(0,0,0,0.1);
                }
                #refreshBtn {
                        margin-top: 25px;
                        padding: 12px 28px;
                        font-size: 18px;
                        border: none;
                        background: #0078ff;
                        color: #fff;
                        border-radius: 8px;
                        cursor: pointer;
                }
                #refreshBtn:hover {
                        background: #005fcc;
                }
        </style>
    </head>
    <body>

    <h1> Random Joke Machine</h1>

    <div id="jokeBox">Loading ... </div>

    <button id="refreshBtn"> Load New Joke </button>

    <br><br>

    <h2>Add a New Joke</h2>

    <input type="text" id="jokeInput" placeholder="Type your joke here"
           style="width:60%;padding:12px;font-size:18px;border-radius:8px;border:1px solid #ddd;">

    <button id="submitBtn"
            style="margin-top:15px;padding:12px 28px;font-size:18px;border:none;background:#28b300;color:#fff;border-radius:8px;cursor:pointer;">
    
    Submit Joke

    </button>

    <div id="submitStatus" style="margin-top:15px;font-size:18px;color:#444;"></div>

    <script>
        async function loadJoke() 
        {
            try
            {
                const response = await fetch("https://render-deployment-aydy.onrender.com/random");
                const data = await response.json();
                document.getElementById("jokeBox").textContent = data.joke;
            }
            catch
            {
                document.getElementById("jokeBox").textContent = "Could not fetch Joke";
            }
        }
 
        document.getElementById("refreshBtn").addEventListener("click", loadJoke);

        loadJoke();

        async function saveJoke()
        {
            const joke = getElementById("jokeInput").value.trim();
            const status = getElementById("submitStatus");
                
            if(!joke)
            {
                status.textContent = "Please enetr a Joke";
                status.style.color = "red";
                return;
            }

            try
            {
                const response = await fetch("https://render-deployment-aydy.onrender.com/add", 
                {
                   method: "POST",
                   headers: {"Content-type": "application/json"},
                   body: JSON.stringify(joke: joke)
                }
                );
                
                const data = await response.json();
                if(response.ok)
                {
                   status.textContent = "Joke added with ID: " + data.id;
                   status.style.color = "green";
                   document.getElementById("jokeInput").value = "";
                   loadJoke();
                }
                else
                {
                   status.textContent = (data.error || "Failed to add joke");
                   status.style.color = "red";
                }
            }
            catch
            {
                status.textContent = "Service Unavailable";
                status.style.color = "red";
            }

            document.getElementById("submitBtn").addEventListener("click", submitJoke);
        }
   </script>
   </body>
</html>
